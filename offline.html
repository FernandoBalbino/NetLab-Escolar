<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/png" href="./assets/images/icone-192.png">
  <title>NetLab Escolar — modo offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc;color:#172033;font-family:Arial,sans-serif}.card{width:min(560px,100%);padding:44px;border:1px solid #d5dae5;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(23,32,51,.16);text-align:center}.icon{width:92px;height:92px;border-radius:22px}h1{margin:22px 0 12px;font-size:clamp(2rem,7vw,3.2rem);line-height:1}p{max-width:42ch;margin:0 auto 26px;color:#67728a;font-size:1.05rem;line-height:1.6}a,button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:2px solid #1d4ed8;border-radius:12px;background:#2563eb;color:#fff;font:700 1rem Arial,sans-serif;text-decoration:none;cursor:pointer}.secondary{margin-left:8px;background:#fff;color:#1d4ed8}@media(max-width:460px){.card{padding:34px 20px}.secondary{margin:10px 0 0}}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./assets/images/icone-192.png" alt="">
    <h1>Você está offline.</h1>
    <p>O laboratório principal está salvo neste dispositivo. Volte ao início para continuar seus projetos e desafios.</p>
    <a href="./index.html">Abrir o NetLab</a>
    <button class="secondary" type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
